name: Conferir sincronização Kamino
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: financeiro-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Consultar estado e contagens sem documentos financeiros
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/kamino-status.mjs
